name: News Central delivery smoke — no source alerts
on:
  push:
    paths:
      - '.github/workflows/news-central-delivery-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: read
concurrency:
  group: news-central-smoke-test
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: news-delivery-lightweight-2026-11-11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate collector offline logic
        run: node --test news_delivery_lightweight/collector.test.mjs
      - name: Verify live feed and isolated source state, no sending
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node news_delivery_lightweight/collector.mjs --dry-run
      - name: Send TEST ONLY through production ntfy and verify independent receipt
        env:
          NEWS_NTFY_TOPIC: newsr-b6826ebca82fb20856cbd1df92019ec1f431
        run: node news_delivery_lightweight/collector.mjs --transport-probe
