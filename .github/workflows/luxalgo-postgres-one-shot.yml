name: LuxAlgo pinned PostgreSQL one-shot acceptance

# Manual only: no push, pull_request, cron, or repository_dispatch triggers.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luxalgo-pg-one-shot
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout acceptance harness
        uses: actions/checkout@v4
      - name: Set up native Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify database secret configured (do not echo)
        env:
          DB_URL: ${{ secrets.SUPABASE_SESSION_POOLER_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo 'Missing secret SUPABASE_SESSION_POOLER_URL; do not paste it into logs.' >&2
            exit 1
          fi
      - name: Retrieve exact pinned LuxAlgo source (no modifications)
        run: |
          mkdir -p vendor/luxalgo
          git -C vendor/luxalgo init -q
          git -C vendor/luxalgo remote add origin https://github.com/LuxAlgo/market-trackers.git
          git -C vendor/luxalgo fetch -q --depth=1 origin 1ecfcca36a224d4758cc6e2e20cca216db43d5ee
          git -C vendor/luxalgo checkout --detach -q FETCH_HEAD
          test "$(git -C vendor/luxalgo rev-parse HEAD)" = "1ecfcca36a224d4758cc6e2e20cca216db43d5ee"
          test -f vendor/luxalgo/packages/core/src/store/sql-driver.ts
      - name: Install only pinned Node postgres client
        run: npm install --no-save --ignore-scripts --no-audit --no-fund pg@8.16.0
      - name: Fetch official Supabase root CA for TLS verification
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/supabase-root-ca.crt" \
            https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt
          grep -Fq -- '-----BEGIN CERTIFICATE-----' "$RUNNER_TEMP/supabase-root-ca.crt"
          grep -Fq -- '-----END CERTIFICATE-----' "$RUNNER_TEMP/supabase-root-ca.crt"
      - name: Bounded database authentication preflight
        env:
          SUPABASE_SESSION_POOLER_URL: ${{ secrets.SUPABASE_SESSION_POOLER_URL }}
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/supabase-root-ca.crt
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const expected = {
            protocol: 'postgresql:',
            hostname: 'aws-0-us-west-1.pooler.supabase.com',
            port: '5432',
            database: '/postgres',
            username: 'scd_luxalgo_acceptance.yeojyalevdljuddehukn',
            sslmode: 'require'
          };
          let client;
          try {
            const url = new URL(process.env.SUPABASE_SESSION_POOLER_URL);
            const checks = {
              protocol: url.protocol === expected.protocol,
              hostname: url.hostname === expected.hostname,
              port: url.port === expected.port,
              database: url.pathname === expected.database,
              username: decodeURIComponent(url.username) === expected.username,
              sslmode: url.searchParams.get('sslmode') === expected.sslmode
            };
            console.log(JSON.stringify({phase:'url_preflight', checks}));
            if (Object.values(checks).some(v => !v)) process.exit(2);
            client = new pg.Client({connectionString:url.toString(), connectionTimeoutMillis:8000});
            await client.connect();
            const {rows} = await client.query('select current_user = $1 as role_ok, current_database() = $2 as database_ok', ['scd_luxalgo_acceptance','postgres']);
            console.log(JSON.stringify({phase:'auth_preflight', ...rows[0]}));
            if (!rows[0].role_ok || !rows[0].database_ok) process.exitCode = 3;
          } catch (error) {
            console.error(JSON.stringify({phase:'auth_preflight', pass:false, error_code:error?.code ?? 'URL_OR_CLIENT_ERROR'}));
            process.exitCode = 1;
          } finally {
            if (client) await client.end().catch(() => {});
          }
          NODE
      - name: Run native driver acceptance (temporary tables only)
        env:
          SUPABASE_SESSION_POOLER_URL: ${{ secrets.SUPABASE_SESSION_POOLER_URL }}
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/supabase-root-ca.crt
        run: node --experimental-strip-types tests/luxalgo_native_pg.mjs

      - name: Run durable PostgreSQL persistence and session acceptance
        env:
          SUPABASE_SESSION_POOLER_URL: ${{ secrets.SUPABASE_SESSION_POOLER_URL }}
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/supabase-root-ca.crt
        run: node acceptance/v9/postgres_persistence.mjs
