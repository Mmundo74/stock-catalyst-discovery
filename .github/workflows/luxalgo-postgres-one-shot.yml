name: LuxAlgo pinned PostgreSQL one-shot acceptance
# Manual only: no push, pull_request, cron, or repository_dispatch triggers.
on:
  workflow_dispatch:
    inputs:
      probe_gdelt_live:
        description: 'Run one bounded live GDELT request (rate-limited; default off)'
        required: false
        type: boolean
        default: false
      probe_independent_news_live:
        description: 'Run bounded live ScienceDaily and News Central ingestions (default off)'
        required: false
        type: boolean
        default: false
      reuse_existing_native_sources:
        description: 'Reuse recent durable LuxAlgo native syncs and skip provider requests (default off)'
        required: false
        type: boolean
        default: false
      probe_senate_efd_live:
        description: 'Re-probe Senate eFD despite documented GET /search/home/ 403 (default off)'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: luxalgo-pg-one-shot
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout acceptance harness
        uses: actions/checkout@v4
      - name: Set up native Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify database secret configured (do not echo)
        env:
          DB_URL: ${{ secrets.SUPABASE_SESSION_POOLER_URL }}
        run: |
          if [ -z "$DB_URL" ]; then echo 'Missing secret SUPABASE_SESSION_POOLER_URL; do not paste it into logs.' >&2; exit 1; fi
      - name: Retrieve exact pinned LuxAlgo source
        run: |
          mkdir -p vendor/luxalgo
          git -C vendor/luxalgo init -q
          git -C vendor/luxalgo remote add origin https://github.com/LuxAlgo/market-trackers.git
          git -C vendor/luxalgo fetch -q --depth=1 origin 1ecfcca36a224d4758cc6e2e20cca216db43d5ee
          git -C vendor/luxalgo checkout --detach -q FETCH_HEAD
          test "$(git -C vendor/luxalgo rev-parse HEAD)" = "1ecfcca36a224d4758cc6e2e20cca216db43d5ee"
          test -f vendor/luxalgo/packages/core/src/store/sql-driver.ts
          test -f vendor/luxalgo/packages/core/src/sources/federalreserve/source.ts
      - name: Apply FINRA per-row market identity compatibility fix
        run: git -C vendor/luxalgo apply "$GITHUB_WORKSPACE/acceptance/v19/luxalgo_finra_market_identity.patch"
      - name: Install only pinned Node postgres client
        run: npm install --no-save --ignore-scripts --no-audit --no-fund pg@8.16.0
      - name: Fetch official Supabase root CA for TLS verification
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/supabase-root-ca.crt" https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt
          grep -Fq -- '-----BEGIN CERTIFICATE-----' "$RUNNER_TEMP/supabase-root-ca.crt"
          grep -Fq -- '-----END CERTIFICATE-----' "$RUNNER_TEMP/supabase-root-ca.crt"
      - name: Bounded database authentication preflight
        env:
          SUPABASE_SESSION_POOLER_URL: ${{ secrets.SUPABASE_SESSION_POOLER_URL }}
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/supabase-root-ca.crt
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const expected={protocol:'postgresql:',hostname:'aws-0-us-west-1.pooler.supabase.com',port:'5432',database:'/postgres',username:'scd_luxalgo_acceptance.yeojyalevdljuddehukn',sslmode:'require'};
          let client;
          try { const url=new URL(process.env.SUPABASE_SESSION_POOLER_URL);
            const checks={protocol:url.protocol===expected.protocol,hostname:url.hostname===expected.hostname,port:url.port===expected.port,database:url.pathname===expected.database,username:decodeURIComponent(url.username)===expected.username,sslmode:url.searchParams.get('sslmode')===expected.sslmode};
            console.log(JSON.stringify({phase:'url_preflight',checks})); if(Object.values(checks).some(v=>!v))process.exit(2);
            client=new pg.Client({connectionString:url.toString(),connectionTimeoutMillis:8000});await client.connect();
            const {rows}=await client.query('select current_user = $1 as role_ok, current_database() = $2 as database_ok',['scd_luxalgo_acceptance','postgres']);console.log(JSON.stringify({phase:'auth_preflight',...rows[0]}));if(!rows[0].role_ok||!rows[0].database_ok)process.exitCode=3;
          } catch(error){console.error(JSON.stringify({phase:'auth_preflight',pass:false,error_code:error?.code??'URL_OR_CLIENT_ERROR'}));process.exitCode=1;}finally{if(client)await client.end().catch(()=>{});}
          NODE
      - name: Run native driver acceptance (temporary tables only)
        env:
          SUPABASE_SESSION_POOLER_URL: ${{ secrets.SUPABASE_SESSION_POOLER_URL }}
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/supabase-root-ca.crt
        run: node --experimental-strip-types tests/luxalgo_native_pg.mjs
      - name: Run durable PostgreSQL persistence and session acceptance
        env:
          SUPABASE_SESSION_POOLER_URL: ${{ secrets.SUPABASE_SESSION_POOLER_URL }}
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/supabase-root-ca.crt
        run: node acceptance/v9/postgres_persistence.mjs
      - name: Test pinned Federal Reserve source normalization
        run: node --test acceptance/v10/federalreserve_source.test.mjs
      - name: Test independent news and market adapter normalization
        run: node --test acceptance/v11/discovery_adapters.test.mjs
      - name: Test fail-closed discovery coverage gate
        run: node --test acceptance/v11/coverage_gate.test.mjs
      - name: Test durable notification outbox claims (no external delivery)
        env:
          SUPABASE_SESSION_POOLER_URL: ${{ secrets.SUPABASE_SESSION_POOLER_URL }}
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/supabase-root-ca.crt
        run: node acceptance/v12/notification_outbox_acceptance.mjs
      - name: Test outbox worker input and lease safeguards
        run: node --test acceptance/v12/outbox_worker.test.mjs
      - name: Test research qualification stage and fail-closed evidence rules
        run: node --test acceptance/v13/research_qualification.test.mjs
      - name: Test durable research qualification persistence (transaction rolls back)
        env:
          SUPABASE_SESSION_POOLER_URL: ${{ secrets.SUPABASE_SESSION_POOLER_URL }}
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/supabase-root-ca.crt
        run: node acceptance/v13/qualification_persistence_acceptance.mjs
      - name: Test opt-in idempotent Make notification adapter (mock transport only)
        run: node --test acceptance/v14/make_delivery_adapter.test.mjs
      - name: Test independent ScienceDaily RSS source adapter
        run: node --test acceptance/v15/sciencedaily_rss.test.mjs
      - name: Run bounded live ScienceDaily RSS snapshot ingestion
        if: ${{ inputs.probe_independent_news_live }}
        env:
          SUPABASE_SESSION_POOLER_URL: ${{ secrets.SUPABASE_SESSION_POOLER_URL }}
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/supabase-root-ca.crt
        run: node acceptance/v15/sciencedaily_rss_once.mjs
      - name: Test bounded independent News Central API collector
        run: node --test acceptance/v18/news_central_api.test.mjs
      - name: Run bounded live News Central all-section ingestion
        if: ${{ inputs.probe_independent_news_live }}
        env:
          SUPABASE_SESSION_POOLER_URL: ${{ secrets.SUPABASE_SESSION_POOLER_URL }}
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/supabase-root-ca.crt
        run: node acceptance/v18/news_central_once.mjs
      - name: Test independent GDELT DOC news adapter
        run: node --test acceptance/v16/gdelt_doc_news.test.mjs

      - name: Test Tickerbot cursor continuity and fail-closed coverage
        run: node --test acceptance/v17/tickerbot_continuity_gate.test.mjs
      - name: Run bounded real LuxAlgo Federal Reserve ingestion
        env:
          SUPABASE_SESSION_POOLER_URL: ${{ secrets.SUPABASE_SESSION_POOLER_URL }}
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/supabase-root-ca.crt
          LUXALGO_MAX_ITEMS: '9'
        run: node acceptance/v10/luxalgo_federalreserve_once.mjs
      - name: Test complete pinned LuxAlgo SEC and federal source catalog bridge
        run: node --test acceptance/v19/luxalgo_catalog.test.mjs acceptance/v19/luxalgo_native_summary.test.mjs acceptance/v19/luxalgo_native_persistence.test.mjs
      - name: Install pinned LuxAlgo workspace dependencies
        working-directory: vendor/luxalgo
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec vitest run packages/core/src/sources/finra-shortvol/parser.test.ts
          pnpm --filter @luxalgo/market-trackers-cli build
      - name: Run implemented non-SEC LuxAlgo sources
        if: ${{ !inputs.reuse_existing_native_sources }}
        env:
          SUPABASE_SESSION_POOLER_URL: ${{ secrets.SUPABASE_SESSION_POOLER_URL }}
          MARKET_TRACKERS_CONTACT: ${{ vars.MARKET_TRACKERS_CONTACT }}
          MARKET_TRACKERS_PATENTSVIEW_KEY: ${{ secrets.MARKET_TRACKERS_PATENTSVIEW_KEY }}
          PROBE_SENATE_EFD_LIVE: ${{ inputs.probe_senate_efd_live }}
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/supabase-root-ca.crt
        run: |
          set -euo pipefail
          export MARKET_TRACKERS_DB="$(node --input-type=module -e 'const u=new URL(process.env.SUPABASE_SESSION_POOLER_URL);u.searchParams.set("options","-c search_path=luxalgo_native,catalyst_acceptance,public");process.stdout.write(u.toString())')"
          export MARKET_TRACKERS_LOG=silent
          # SEC EDGAR daily and bulk sources are deliberately excluded until authorized.
          # The bridge still expects the full pinned catalog, so coverage reports them missing.
          SOURCES='house-clerk,usaspending,lda,finra,congress-legislators,patentsview,clinicaltrials,openfda,cftc,wikimedia,govinfo,fec,govinfo-hearings,federalreserve'
          if [ "$PROBE_SENATE_EFD_LIVE" = 'true' ]; then SOURCES="senate-efd,$SOURCES"; fi
          node vendor/luxalgo/packages/cli/dist/index.js sync \
            --source "$SOURCES" \
            --limit 25 --allow-partial --json \
            > "$RUNNER_TEMP/luxalgo-sync-summary.json" 2> "$RUNNER_TEMP/luxalgo-sync-stderr.log" || true
          test -s "$RUNNER_TEMP/luxalgo-sync-summary.json"

      - name: Reuse recent durable LuxAlgo source results without provider requests
        if: ${{ inputs.reuse_existing_native_sources }}
        env:
          SUPABASE_SESSION_POOLER_URL: ${{ secrets.SUPABASE_SESSION_POOLER_URL }}
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/supabase-root-ca.crt
          LUXALGO_NATIVE_SUMMARY_MAX_AGE_MINUTES: '60'
          LUXALGO_PROBE_SENATE_EFD_LIVE: ${{ inputs.probe_senate_efd_live }}
        run: |
          node acceptance/v19/luxalgo_native_summary_once.mjs \
            > "$RUNNER_TEMP/luxalgo-sync-summary.json"
          test -s "$RUNNER_TEMP/luxalgo-sync-summary.json"

      - name: Export LuxAlgo native snapshots and persist shared evidence
        env:
          SUPABASE_SESSION_POOLER_URL: ${{ secrets.SUPABASE_SESSION_POOLER_URL }}
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/supabase-root-ca.crt
        run: |
          set -euo pipefail
          export MARKET_TRACKERS_DB="$(node --input-type=module -e 'const u=new URL(process.env.SUPABASE_SESSION_POOLER_URL);u.searchParams.set("options","-c search_path=luxalgo_native,catalyst_acceptance,public");process.stdout.write(u.toString())')"
          export MARKET_TRACKERS_LOG=silent
          node vendor/luxalgo/packages/cli/dist/index.js export --out "$RUNNER_TEMP/luxalgo-dumps" --snapshots-only --json \
            > "$RUNNER_TEMP/luxalgo-export-summary.json" 2> "$RUNNER_TEMP/luxalgo-export-stderr.log"
          SUPABASE_SESSION_POOLER_URL="$SUPABASE_SESSION_POOLER_URL" \
            LUXALGO_SYNC_SUMMARY="$RUNNER_TEMP/luxalgo-sync-summary.json" \
            LUXALGO_EXPORT_DIR="$RUNNER_TEMP/luxalgo-dumps" \
            node acceptance/v19/luxalgo_native_once.mjs
      - name: Run bounded live GDELT DOC ingestion (raw evidence only)
        if: ${{ inputs.probe_gdelt_live }}
        env:
          SUPABASE_SESSION_POOLER_URL: ${{ secrets.SUPABASE_SESSION_POOLER_URL }}
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/supabase-root-ca.crt
        run: node acceptance/v16/gdelt_doc_news_once.mjs
