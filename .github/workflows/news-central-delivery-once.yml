name: Stock News — News Central hourly source notices
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  issues: write
concurrency:
  group: independent-news-central-delivery
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3cf853c404f38c6e5796a53ede224086ee40c522
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate independent collector regressions
        run: node --test news_delivery_lightweight/collector.test.mjs
      - name: Fetch feed and send only genuinely new source headlines
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEWS_NTFY_TOPIC: newsr-b6826ebca82fb20856cbd1df92019ec1f431
        run: node news_delivery_lightweight/collector.mjs
