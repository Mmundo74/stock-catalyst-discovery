name: News-only free push transport acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Publish one non-news test message and verify API receipt
        env:
          NEWS_NTFY_TOPIC: newsr-b6826ebca82fb20856cbd1df92019ec1f431
        run: |
          node --input-type=module - <<'NODE'
          const topic=process.env.NEWS_NTFY_TOPIC;
          const response=await fetch('https://ntfy.sh/',{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({topic,title:'Stock News Discovery — transport test',
            message:'TEST ONLY. No financial analysis, no source news, no market triggers.',tags:['test_tube']})
          });
          if(!response.ok)throw new Error('ntfy_http_'+response.status);
          const receipt=await response.json();
          if(!receipt?.id)throw new Error('missing_ntfy_receipt_id');
          let found=false;
          let attempts=0;
          for(let i=0;i<6&&!found;i++){
            attempts=i+1;
            await new Promise(resolve=>setTimeout(resolve,1000+i*500));
            const history=await fetch('https://ntfy.sh/'+topic+'/json?poll=1&since=all',{headers:{'cache-control':'no-cache'}});
            if(!history.ok)continue;
            const lines=(await history.text()).trim().split('\n').filter(Boolean);
            found=lines.some(line=>{try{return JSON.parse(line).id===receipt.id}catch{return false}});
          }
          if(!found)throw new Error('ntfy_readback_mismatch_after_'+attempts);
          console.log(JSON.stringify({ntfy_publish:true,ntfy_readback:true,message_id:receipt.id,kind:'TEST_ONLY'}));
          NODE
