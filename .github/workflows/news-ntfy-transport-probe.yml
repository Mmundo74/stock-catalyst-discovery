name: News-only free push transport acceptance
on:
  push:
    paths:
      - '.github/workflows/news-ntfy-transport-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Publish one non-news test message and verify API receipt
        env:
          NEWS_NTFY_TOPIC: newsr-b6826ebca82fb20856cbd1df92019ec1f431
        run: |
          node --input-type=module - <<'NODE'
          const topic=process.env.NEWS_NTFY_TOPIC;
          const response=await fetch('https://ntfy.sh/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic,title:'Stock News Discovery — transport test',message:'TEST ONLY. No financial analysis, no provider news, no market triggers. This only verifies push delivery.',tags:['test_tube']})});
          if(!response.ok)throw new Error('ntfy_http_'+response.status);
          const receipt=await response.json();
          if(!receipt.id)throw new Error('missing_ntfy_receipt_id');
          let found=false,historyCount=0,historyStatus=null,historyPreview='';
          for(let attempt=0;attempt<6;attempt++){
            await new Promise(resolve=>setTimeout(resolve,1000+attempt*500));
            const history=await fetch('https://ntfy.sh/'+topic+'/json?poll=1&since=all',{headers:{'cache-control':'no-cache'}});
            historyStatus=history.status;
            if(!history.ok)continue;
            const responseText=(await history.text()).trim();
            historyPreview=responseText.slice(0,250);
            const lines=responseText.split('\n').filter(Boolean).flatMap(x=>{try{return [JSON.parse(x)]}catch{return []}});
            historyCount=lines.length;
            if(lines.some(x=>x.id===receipt.id)){found=true;break;}
          }
          if(!found)throw new Error('ntfy_readback_mismatch_status_'+historyStatus+'_count_'+historyCount+'_preview_'+historyPreview.replace(/[^a-zA-Z0-9_:,-]/g,'_').slice(0,100));
          console.log(JSON.stringify({ntfy_publish:true,ntfy_readback:true,message_id:receipt.id,topic_url:'https://ntfy.sh/'+topic,kind:'TEST_ONLY'}));
          NODE
